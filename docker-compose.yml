services:
  db:
    image: redis:7-alpine
    container_name: db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  app:
    build: .
    # Прибираємо container_name, щоб дозволити масштабування
    networks:
      - frontend
      - backend
    environment:
      - REDIS_HOST=db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000')"]
      interval: 5s
      timeout: 3s
      retries: 3

  proxy:
    image: nginx:1.27-alpine
    container_name: proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
    depends_on:
      app:
        condition: service_healthy

networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backend:
    driver: bridge
    internal: true # Забороняє вихід у зовнішній світ (для безпеки)
    ipam:
      config:
        - subnet: 172.31.0.0/24
